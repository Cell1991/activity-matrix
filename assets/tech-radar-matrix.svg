<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020712" />
      <stop offset="100%" stop-color="#030c16" />
    </linearGradient>

    <linearGradient id="tierAdopt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="tierTrial" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="tierAssess" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="tierHold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <pattern id="radarGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#13334a" opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .font-h { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-c { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-b { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
  </style>

  <rect width="1200" height="640" rx="16" fill="url(#radarBg)" stroke="#16394f" stroke-width="2" />
  <rect width="1200" height="640" fill="url(#radarGrid)" />

  <!-- HEADER -->
  <g transform="translate(45, 36)">
    <text x="0" y="0" fill="#10B981" class="font-c" font-size="12" font-weight="700" letter-spacing="2">03 // TAXONOMIC TECH RADAR</text>
    <text x="0" y="24" fill="#FFFFFF" class="font-h" font-size="20">Telemetry Ecosystem &amp; Storage Architecture Matrix</text>
    <text x="0" y="44" fill="#94A3B8" class="font-b" font-size="13">Strict engineering standards governing audit ingestion, serialization, and disk persistence</text>
  </g>

  <!-- ================= 4 TIERS (HEIGHT 114 EACH) ================= -->

  <!-- TIER 1: ADOPT (Y: 96) -->
  <g transform="translate(45, 96)">
    <rect width="1110" height="114" rx="10" fill="#051926" stroke="#16435f" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="url(#tierAdopt)" />
    
    <!-- Left Column Text (Strictly bounded under x <= 360) -->
    <text x="24" y="27" fill="#10B981" class="font-c" font-size="11" font-weight="800">TIER 01 // PROVEN STANDARDS</text>
    <text x="24" y="50" fill="#FFFFFF" class="font-h" font-size="15.5">ADOPT (Core Operational Mandate)</text>
    <text x="24" y="74" fill="#94A3B8" class="font-b" font-size="11.5">
      <tspan x="24" dy="0">Direct I/O append-only stream cycles;</tspan>
      <tspan x="24" dy="18">OTel v1.32 specs &amp; deterministic sequence.</tspan>
    </text>

    <!-- Badges Row (Starting at x=410, Y: 39) -->
    <g transform="translate(410, 39)">
      <rect x="0" y="0" width="130" height="36" rx="6" fill="#04231b" stroke="#10b981" stroke-width="1.2" />
      <text x="65" y="22" fill="#34D399" class="font-c" font-size="11" font-weight="700" text-anchor="middle">activity.log Sink</text>

      <rect x="142" y="0" width="130" height="36" rx="6" fill="#082236" stroke="#06b6d4" stroke-width="1.2" />
      <text x="207" y="22" fill="#00F2FE" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Direct I/O WAL</text>

      <rect x="284" y="0" width="140" height="36" rx="6" fill="#082236" stroke="#0284c7" stroke-width="1.2" />
      <text x="354" y="22" fill="#38BDF8" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Ring Buffer Arena</text>

      <rect x="436" y="0" width="125" height="36" rx="6" fill="#082236" stroke="#3b82f6" stroke-width="1.2" />
      <text x="498" y="22" fill="#93C5FD" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Git Versioning</text>

      <rect x="573" y="0" width="95" height="36" rx="6" fill="#082236" stroke="#10b981" stroke-width="1.2" />
      <text x="620" y="22" fill="#6EE7B7" class="font-c" font-size="11" font-weight="700" text-anchor="middle">mTLS 1.3</text>
    </g>
  </g>

  <!-- TIER 2: TRIAL (Y: 226) -->
  <g transform="translate(45, 226)">
    <rect width="1110" height="114" rx="10" fill="#051926" stroke="#16435f" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="url(#tierTrial)" />
    
    <!-- Left Column Text -->
    <text x="24" y="27" fill="#8B5CF6" class="font-c" font-size="11" font-weight="800">TIER 02 // ACCELERATION &amp; SCALE</text>
    <text x="24" y="50" fill="#FFFFFF" class="font-h" font-size="15.5">TRIAL (Active High-Throughput Trials)</text>
    <text x="24" y="74" fill="#94A3B8" class="font-b" font-size="11.5">
      <tspan x="24" dy="0">Kernel eBPF state mutation probes;</tspan>
      <tspan x="24" dy="18">Multi-Raft quorum consensus streams.</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(410, 39)">
      <rect x="0" y="0" width="130" height="36" rx="6" fill="#1b1238" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="65" y="22" fill="#C4B5FD" class="font-c" font-size="11" font-weight="700" text-anchor="middle">eBPF Tracing</text>

      <rect x="145" y="0" width="155" height="36" rx="6" fill="#1b1238" stroke="#7c3aed" stroke-width="1.2" />
      <text x="222" y="22" fill="#DDD6FE" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Multi-Raft Consensus</text>

      <rect x="315" y="0" width="140" height="36" rx="6" fill="#1b1238" stroke="#6366f1" stroke-width="1.2" />
      <text x="385" y="22" fill="#A5B4FC" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Zstd Compression</text>

      <rect x="470" y="0" width="130" height="36" rx="6" fill="#1b1238" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="535" y="22" fill="#C4B5FD" class="font-c" font-size="11" font-weight="700" text-anchor="middle">AsyncIO Pool</text>
    </g>
  </g>

  <!-- TIER 3: ASSESS (Y: 356) -->
  <g transform="translate(45, 356)">
    <rect width="1110" height="114" rx="10" fill="#051926" stroke="#16435f" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="url(#tierAssess)" />
    
    <!-- Left Column Text -->
    <text x="24" y="27" fill="#F59E0B" class="font-c" font-size="11" font-weight="800">TIER 03 // RESEARCH &amp; INNOVATION</text>
    <text x="24" y="50" fill="#FFFFFF" class="font-h" font-size="15.5">ASSESS (Next-Generation Telemetry)</text>
    <text x="24" y="74" fill="#94A3B8" class="font-b" font-size="11.5">
      <tspan x="24" dy="0">Post-quantum cryptographic hash chaining;</tspan>
      <tspan x="24" dy="18">Autonomous anomaly suppression AI.</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(410, 39)">
      <rect x="0" y="0" width="170" height="36" rx="6" fill="#2d1d05" stroke="#f59e0b" stroke-width="1.2" />
      <text x="85" y="22" fill="#FCD34D" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Post-Quantum Hashes</text>

      <rect x="185" y="0" width="180" height="36" rx="6" fill="#2d1d05" stroke="#d97706" stroke-width="1.2" />
      <text x="275" y="22" fill="#FDE68A" class="font-c" font-size="11" font-weight="700" text-anchor="middle">AI Anomaly Suppression</text>

      <rect x="380" y="0" width="165" height="36" rx="6" fill="#2d1d05" stroke="#f59e0b" stroke-width="1.2" />
      <text x="462" y="22" fill="#FCD34D" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Autonomous Mesh</text>
    </g>
  </g>

  <!-- TIER 4: HOLD (Y: 486) -->
  <g transform="translate(45, 486)">
    <rect width="1110" height="114" rx="10" fill="#051926" stroke="#16435f" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="114" rx="3" fill="url(#tierHold)" />
    
    <!-- Left Column Text -->
    <text x="24" y="27" fill="#EF4444" class="font-c" font-size="11" font-weight="800">TIER 04 // DEPRECATED &amp; FORBIDDEN</text>
    <text x="24" y="50" fill="#FFFFFF" class="font-h" font-size="15.5">HOLD (Strictly Prohibited in Production)</text>
    <text x="24" y="74" fill="#94A3B8" class="font-b" font-size="11.5">
      <tspan x="24" dy="0">Destructive in-place log overwrites;</tspan>
      <tspan x="24" dy="18">Unindexed raw blobs &amp; blocking sync RPC.</tspan>
    </text>

    <!-- Badges Row -->
    <g transform="translate(410, 39)">
      <rect x="0" y="0" width="160" height="36" rx="6" fill="#290707" stroke="#ef4444" stroke-width="1.2" />
      <text x="80" y="22" fill="#FCA5A5" class="font-c" font-size="11" font-weight="700" text-anchor="middle">In-Place Overwrites</text>

      <rect x="175" y="0" width="155" height="36" rx="6" fill="#290707" stroke="#dc2626" stroke-width="1.2" />
      <text x="252" y="22" fill="#FECACA" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Blocking Sync RPC</text>

      <rect x="345" y="0" width="170" height="36" rx="6" fill="#290707" stroke="#b91c1c" stroke-width="1.2" />
      <text x="430" y="22" fill="#FCA5A5" class="font-c" font-size="11" font-weight="700" text-anchor="middle">Unversioned Records</text>
    </g>
  </g>
</svg>
