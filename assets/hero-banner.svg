<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020610" />
      <stop offset="35%" stop-color="#04121e" />
      <stop offset="75%" stop-color="#051c28" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>

    <!-- Emerald / Cyan / Electric Sky -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="matrixGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0e283c" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="30" cy="0" r="1.2" fill="#00F2FE" fill-opacity="0.35"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dashStream {
      to { stroke-dashoffset: -360; }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px #00F2FE); }
    }
    @keyframes rotateRingClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateRingCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .stream-line {
      stroke-dasharray: 8 14;
      animation: dashStream 10s linear infinite;
    }
    .stream-fast {
      stroke-dasharray: 10 18;
      animation: dashStream 5s linear infinite;
    }
    .rotating-outer {
      transform-origin: 920px 230px;
      animation: rotateRingClockwise 24s linear infinite;
    }
    .rotating-inner {
      transform-origin: 920px 230px;
      animation: rotateRingCounter 16s linear infinite;
    }
    .pulsing-matrix-core {
      transform-origin: 920px 230px;
      animation: pulseCore 3.5s ease-in-out infinite;
    }
    .dot-blink {
      animation: blinkDot 2s ease-in-out infinite;
    }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="460" rx="16" fill="url(#bgDark)" stroke="#16394f" stroke-width="2" />
  <rect width="1200" height="460" fill="url(#matrixGrid)" />

  <!-- Ambient Glow Spots -->
  <circle cx="250" cy="180" r="300" fill="url(#cyanGlow)" />
  <circle cx="920" cy="230" r="280" fill="url(#emeraldGlow)" />

  <!-- Animated Data Streams (Horizontal & Diagonal Paths) -->
  <g opacity="0.75">
    <path d="M 60 70 L 650 70 L 760 180 L 920 180" fill="none" stroke="#00F2FE" stroke-width="1.8" class="stream-line" opacity="0.8" />
    <path d="M 120 390 L 700 390 L 800 280 L 920 280" fill="none" stroke="#10B981" stroke-width="1.8" class="stream-fast" opacity="0.8" />
    <path d="M 920 230 L 1120 230" fill="none" stroke="#38BDF8" stroke-width="2.5" class="stream-fast" />
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(70, 75)">
    <!-- Top Micro Tag -->
    <g>
      <rect x="0" y="0" width="350" height="28" rx="6" fill="#081c2c" stroke="#00F2FE" stroke-width="1.2" />
      <circle cx="14" cy="14" r="4" fill="#00F2FE" class="dot-blink" />
      <text x="28" y="18" fill="#00F2FE" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE TELEMETRY // REAL-TIME EVENT MESH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#cyberGrad)" class="font-sans" font-size="46" font-weight="900" letter-spacing="-0.5" filter="url(#glow-cyan)">
      ACTIVITY TELEMETRY MATRIX
    </text>

    <!-- Subtitle -->
    <text x="0" y="120" fill="#E2E8F0" class="font-sans" font-size="20" font-weight="700">
      Distributed Telemetry Ingestion &amp; Sequential Append-Only Engine
    </text>

    <!-- Description Block -->
    <text x="0" y="152" fill="#94A3B8" class="font-sans" font-size="14.5" font-weight="500">
      Battle-tested zero-allocation memory buffering with deterministic WAL serialization.
    </text>
    <text x="0" y="174" fill="#94A3B8" class="font-sans" font-size="14.5" font-weight="500">
      Ingests high-cardinality multi-tenant events directly into immutable persistent storage.
    </text>

    <!-- Metric Chips Matrix -->
    <g transform="translate(0, 215)">
      <!-- Metric 1 -->
      <g>
        <rect x="0" y="0" width="145" height="58" rx="8" fill="#051a28" stroke="#16394f" stroke-width="1.2" />
        <text x="14" y="24" fill="#00F2FE" class="font-mono" font-size="18" font-weight="800">1.42M+</text>
        <text x="14" y="44" fill="#94A3B8" class="font-mono" font-size="10.5" font-weight="600">EVENTS / SEC</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="145" height="58" rx="8" fill="#051a28" stroke="#16394f" stroke-width="1.2" />
        <text x="14" y="24" fill="#10B981" class="font-mono" font-size="18" font-weight="800">&lt; 0.42ms</text>
        <text x="14" y="44" fill="#94A3B8" class="font-mono" font-size="10.5" font-weight="600">P99 INGEST SLA</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="145" height="58" rx="8" fill="#051a28" stroke="#16394f" stroke-width="1.2" />
        <text x="14" y="24" fill="#F59E0B" class="font-mono" font-size="18" font-weight="800">99.999%</text>
        <text x="14" y="44" fill="#94A3B8" class="font-mono" font-size="10.5" font-weight="600">DURABILITY SLA</text>
      </g>

      <!-- Metric 4 (Sink) -->
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="165" height="58" rx="8" fill="#06221c" stroke="#10b981" stroke-width="1.2" />
        <text x="14" y="24" fill="#10b981" class="font-mono" font-size="16" font-weight="800">activity.log</text>
        <text x="14" y="44" fill="#34D399" class="font-mono" font-size="10.5" font-weight="600">PRIMARY WAL SINK</text>
      </g>
    </g>
  </g>

  <!-- RIGHT CYBER-CORE VISUALIZATION -->
  <g>
    <!-- Outer Orbit Ring with Dash -->
    <circle cx="920" cy="230" r="140" fill="none" stroke="#163f58" stroke-width="1.5" stroke-dasharray="12 12" class="rotating-outer" />
    
    <!-- Middle Orbit Ring with Nodes -->
    <g class="rotating-inner">
      <circle cx="920" cy="230" r="105" fill="none" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="8 16" opacity="0.85" />
      <circle cx="1025" cy="230" r="5" fill="#00F2FE" />
      <circle cx="815" cy="230" r="5" fill="#10B981" />
      <circle cx="920" cy="125" r="5" fill="#38BDF8" />
      <circle cx="920" cy="335" r="5" fill="#A78BFA" />
    </g>

    <!-- Inner Shield Hexagon / Ring -->
    <circle cx="920" cy="230" r="70" fill="#051724" stroke="#06b6d4" stroke-width="2" />

    <!-- Pulsing Nuclear Core -->
    <g class="pulsing-matrix-core">
      <circle cx="920" cy="230" r="45" fill="url(#cyberGrad)" opacity="0.95" filter="url(#glow-core)" />
      <circle cx="920" cy="230" r="24" fill="#020813" />
      <circle cx="920" cy="230" r="12" fill="#00F2FE" />
    </g>

    <!-- Output Stream Target (activity.log Node) -->
    <g transform="translate(1060, 205)">
      <rect x="0" y="0" width="105" height="50" rx="8" fill="#041b16" stroke="#10B981" stroke-width="1.8" filter="url(#glow-cyan)" />
      <text x="52" y="22" fill="#10B981" class="font-mono" font-size="12" font-weight="800" text-anchor="middle">SINK</text>
      <text x="52" y="38" fill="#FFFFFF" class="font-mono" font-size="10" font-weight="700" text-anchor="middle">activity.log</text>
    </g>
  </g>
</svg>
