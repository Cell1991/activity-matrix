<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="topoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020712" />
      <stop offset="50%" stop-color="#04121e" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>

    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071c2c" />
      <stop offset="100%" stop-color="#030f18" />
    </linearGradient>

    <linearGradient id="cardBgSink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062920" />
      <stop offset="100%" stop-color="#02140f" />
    </linearGradient>

    <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="emeraldLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <pattern id="dotGridTopo" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#13334a" opacity="0.65"/>
    </pattern>

    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 4px #00F2FE); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #00F2FE); }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -120; }
    }
    .flow-stream {
      stroke-dasharray: 6 10;
      animation: flowDash 3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 12;
      animation: flowDash 1.8s linear infinite;
    }
    .pulse-target {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="680" rx="16" fill="url(#topoBg)" stroke="#16394f" stroke-width="2" />
  <rect width="1200" height="680" fill="url(#dotGridTopo)" />

  <!-- HEADER -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="370" height="26" rx="6" fill="#072030" stroke="#00F2FE" stroke-width="1.2" />
    <text x="14" y="17" fill="#00F2FE" class="font-mono" font-size="11" font-weight="800" letter-spacing="1.5">01 // TOPOLOGY ARCHITECTURE &amp; DATA FABRIC</text>
    <text x="0" y="60" fill="#FFFFFF" class="font-sans" font-size="24" font-weight="900">Distributed Event Mesh &amp; Direct-to-Disk WAL Pipeline</text>
    <text x="0" y="85" fill="#94A3B8" class="font-sans" font-size="14">Multi-stage decoupled ingestion stream engineered for non-blocking sub-millisecond writes</text>
  </g>

  <!-- ================= PIPELINE COLUMNS ================= -->

  <!-- COLUMN 1: EDGE INGRESS (X: 50, Y: 170) -->
  <g transform="translate(50, 170)">
    <rect width="230" height="450" rx="12" fill="#04121d" stroke="#163c54" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="4" rx="2" fill="#00F2FE" />
    
    <text x="20" y="32" fill="#00F2FE" class="font-mono" font-size="11" font-weight="800">PLANE 01</text>
    <text x="20" y="54" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">Edge Ingress Mesh</text>
    <text x="20" y="72" fill="#64748B" class="font-sans" font-size="12">Multi-channel event telemetry</text>

    <!-- Edge Item 1 -->
    <g transform="translate(15, 95)">
      <rect width="200" height="68" rx="8" fill="url(#cardBg1)" stroke="#1e4663" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="13" font-weight="700">Client Telemetry</text>
      <text x="14" y="42" fill="#00F2FE" class="font-mono" font-size="11">gRPC / HTTP/3 Ingress</text>
      <text x="14" y="58" fill="#94A3B8" class="font-mono" font-size="10">Port 8443 • TLS 1.3</text>
    </g>

    <!-- Edge Item 2 -->
    <g transform="translate(15, 180)">
      <rect width="200" height="68" rx="8" fill="url(#cardBg1)" stroke="#1e4663" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="13" font-weight="700">Auth Middleware</text>
      <text x="14" y="42" fill="#38BDF8" class="font-mono" font-size="11">mTLS Token Refresh</text>
      <text x="14" y="58" fill="#94A3B8" class="font-mono" font-size="10">Session Attestation</text>
    </g>

    <!-- Edge Item 3 -->
    <g transform="translate(15, 265)">
      <rect width="200" height="68" rx="8" fill="url(#cardBg1)" stroke="#1e4663" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="13" font-weight="700">Kernel Probe Daemons</text>
      <text x="14" y="42" fill="#06B6D4" class="font-mono" font-size="11">eBPF Tracepoints</text>
      <text x="14" y="58" fill="#94A3B8" class="font-mono" font-size="10">Ring Buffer Ring 0</text>
    </g>

    <!-- Edge Item 4 -->
    <g transform="translate(15, 350)">
      <rect width="200" height="68" rx="8" fill="url(#cardBg1)" stroke="#1e4663" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="13" font-weight="700">Cron State Mutator</text>
      <text x="14" y="42" fill="#10B981" class="font-mono" font-size="11">Heartbeat Generator</text>
      <text x="14" y="58" fill="#94A3B8" class="font-mono" font-size="10">Deterministic Pulse</text>
    </g>
  </g>

  <!-- FLOW LINES (COL 1 -> COL 2) -->
  <g>
    <path d="M 280 295 L 340 295" fill="none" stroke="#00F2FE" stroke-width="2.5" class="flow-stream" />
    <path d="M 280 380 L 340 380" fill="none" stroke="#06B6D4" stroke-width="2.5" class="flow-stream" />
    <path d="M 280 465 L 340 465" fill="none" stroke="#38BDF8" stroke-width="2.5" class="flow-stream" />
  </g>

  <!-- COLUMN 2: MEMORY STAGING & CONSENSUS (X: 340, Y: 170) -->
  <g transform="translate(340, 170)">
    <rect width="250" height="450" rx="12" fill="#041421" stroke="#16435f" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#06B6D4" />

    <text x="20" y="32" fill="#06B6D4" class="font-mono" font-size="11" font-weight="800">PLANE 02</text>
    <text x="20" y="54" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">Memory &amp; Consensus</text>
    <text x="20" y="72" fill="#64748B" class="font-sans" font-size="12">Zero-copy arena &amp; Raft state</text>

    <!-- Ring Buffer Arena -->
    <g transform="translate(15, 105)">
      <rect width="220" height="95" rx="8" fill="url(#cardBg1)" stroke="#1d4e70" stroke-width="1.2" />
      <text x="16" y="26" fill="#00F2FE" class="font-mono" font-size="13" font-weight="700">L1 Ring Buffer Arena</text>
      <text x="16" y="46" fill="#FFFFFF" class="font-sans" font-size="12">64 MB Off-Heap Page Array</text>
      <text x="16" y="66" fill="#94A3B8" class="font-mono" font-size="11">Zero-allocation atomic CAS</text>
      <rect x="16" y="78" width="188" height="6" rx="3" fill="#0a2233" />
      <rect x="16" y="78" width="28" height="6" rx="3" fill="#00F2FE" />
    </g>

    <!-- Consensus Engine -->
    <g transform="translate(15, 220)">
      <rect width="220" height="95" rx="8" fill="url(#cardBg1)" stroke="#1d4e70" stroke-width="1.2" />
      <text x="16" y="26" fill="#38BDF8" class="font-mono" font-size="13" font-weight="700">Multi-Raft Consensus</text>
      <text x="16" y="46" fill="#FFFFFF" class="font-sans" font-size="12">Decentralized Quorum Log</text>
      <text x="16" y="66" fill="#94A3B8" class="font-mono" font-size="11">State machine replication</text>
      <text x="16" y="82" fill="#10B981" class="font-mono" font-size="10">Quorum: 3/3 Healthy</text>
    </g>

    <!-- Batch Normalizer -->
    <g transform="translate(15, 335)">
      <rect width="220" height="80" rx="8" fill="url(#cardBg1)" stroke="#1d4e70" stroke-width="1.2" />
      <text x="16" y="26" fill="#F59E0B" class="font-mono" font-size="13" font-weight="700">Adaptive Micro-Batch</text>
      <text x="16" y="46" fill="#FFFFFF" class="font-sans" font-size="12">Dynamic 50ms Watermark</text>
      <text x="16" y="66" fill="#94A3B8" class="font-mono" font-size="11">Throughput: 1.42M msg/sec</text>
    </g>
  </g>

  <!-- FLOW LINES (COL 2 -> COL 3) -->
  <g>
    <path d="M 590 310 L 650 310" fill="none" stroke="#06B6D4" stroke-width="2.5" class="flow-fast" />
    <path d="M 590 395 L 650 395" fill="none" stroke="#38BDF8" stroke-width="2.5" class="flow-fast" />
  </g>

  <!-- COLUMN 3: STREAM PROCESSING & WAL (X: 650, Y: 170) -->
  <g transform="translate(650, 170)">
    <rect width="250" height="450" rx="12" fill="#051522" stroke="#184a6a" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#8B5CF6" />

    <text x="20" y="32" fill="#A78BFA" class="font-mono" font-size="11" font-weight="800">PLANE 03</text>
    <text x="20" y="54" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">Processing &amp; WAL</text>
    <text x="20" y="72" fill="#64748B" class="font-sans" font-size="12">Schema 3NF &amp; Write-Ahead Log</text>

    <!-- Entity Relation Normalizer -->
    <g transform="translate(15, 105)">
      <rect width="220" height="95" rx="8" fill="url(#cardBg1)" stroke="#225377" stroke-width="1.2" />
      <text x="16" y="26" fill="#A78BFA" class="font-mono" font-size="13" font-weight="700">Entity Normalizer</text>
      <text x="16" y="46" fill="#FFFFFF" class="font-sans" font-size="12">OTel 3NF Schema Ingestion</text>
      <text x="16" y="66" fill="#94A3B8" class="font-mono" font-size="11">Payload hash validation</text>
      <text x="16" y="82" fill="#38BDF8" class="font-mono" font-size="10">CRC32 / SHA-256 Checksum</text>
    </g>

    <!-- Deduplication Bloom Filter -->
    <g transform="translate(15, 220)">
      <rect width="220" height="95" rx="8" fill="url(#cardBg1)" stroke="#225377" stroke-width="1.2" />
      <text x="16" y="26" fill="#EC4899" class="font-mono" font-size="13" font-weight="700">Deduplication Filter</text>
      <text x="16" y="46" fill="#FFFFFF" class="font-sans" font-size="12">Counting Bloom Matrix</text>
      <text x="16" y="66" fill="#94A3B8" class="font-mono" font-size="11">False positive rate: &lt;0.001%</text>
      <text x="16" y="82" fill="#10B981" class="font-mono" font-size="10">Ghost commits rejected</text>
    </g>

    <!-- Direct I/O WAL Engine -->
    <g transform="translate(15, 335)">
      <rect width="220" height="80" rx="8" fill="url(#cardBg1)" stroke="#225377" stroke-width="1.2" />
      <text x="16" y="26" fill="#10B981" class="font-mono" font-size="13" font-weight="700">WAL Direct I/O Flush</text>
      <text x="16" y="46" fill="#FFFFFF" class="font-sans" font-size="12">O_DIRECT Linux Syscall</text>
      <text x="16" y="66" fill="#94A3B8" class="font-mono" font-size="11">Direct write to block device</text>
    </g>
  </g>

  <!-- FLOW LINES (COL 3 -> COL 4 SINK) -->
  <g>
    <path d="M 900 375 L 960 375" fill="none" stroke="#10B981" stroke-width="3.5" class="flow-fast" filter="url(#glow-teal)" />
  </g>

  <!-- COLUMN 4: THE ULTIMATE SINK (X: 960, Y: 170) -->
  <g transform="translate(960, 170)" class="pulse-target">
    <rect width="190" height="450" rx="14" fill="url(#cardBgSink)" stroke="#10B981" stroke-width="2.5" />
    <rect x="0" y="0" width="190" height="6" rx="3" fill="#10B981" />

    <text x="20" y="34" fill="#10B981" class="font-mono" font-size="11" font-weight="800">PRIMARY SINK</text>
    <text x="20" y="58" fill="#FFFFFF" class="font-sans" font-size="17" font-weight="900">Immutable Ledger</text>
    <text x="20" y="78" fill="#6EE7B7" class="font-sans" font-size="12">Single Source of Truth</text>

    <!-- Target File Badge Container -->
    <g transform="translate(15, 120)">
      <rect width="160" height="130" rx="10" fill="#041a14" stroke="#10b981" stroke-width="1.5" />
      <circle cx="80" cy="40" r="22" fill="#062e24" stroke="#10B981" stroke-width="1.8" />
      <!-- File Icon -->
      <path d="M 72 28 L 84 28 L 90 34 L 90 52 L 72 52 Z" fill="none" stroke="#10B981" stroke-width="1.8" />
      <line x1="76" y1="38" x2="84" y2="38" stroke="#10B981" stroke-width="1.5" />
      <line x1="76" y1="44" x2="86" y2="44" stroke="#10B981" stroke-width="1.5" />

      <text x="80" y="84" fill="#34D399" class="font-mono" font-size="14" font-weight="900" text-anchor="middle">activity.log</text>
      <text x="80" y="104" fill="#94A3B8" class="font-mono" font-size="10.5" font-weight="600" text-anchor="middle">APPEND-ONLY WAL</text>
      <text x="80" y="118" fill="#10B981" class="font-mono" font-size="9" text-anchor="middle">● STREAMING 24/7</text>
    </g>

    <!-- SLA Highlights -->
    <g transform="translate(15, 275)">
      <rect width="160" height="140" rx="8" fill="#031610" stroke="#0a392b" stroke-width="1" />
      <text x="14" y="24" fill="#FFFFFF" class="font-mono" font-size="11" font-weight="700">DURABILITY SLA</text>
      <text x="14" y="46" fill="#10B981" class="font-mono" font-size="17" font-weight="800">99.999%</text>
      <text x="14" y="70" fill="#94A3B8" class="font-mono" font-size="10">No Overwrite</text>
      <text x="14" y="86" fill="#94A3B8" class="font-mono" font-size="10">Continuous Append</text>
      <text x="14" y="102" fill="#94A3B8" class="font-mono" font-size="10">Deterministic Hash</text>
      <text x="14" y="122" fill="#00F2FE" class="font-mono" font-size="10">Sync: O_APPEND</text>
    </g>
  </g>
</svg>
