<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020712" />
      <stop offset="100%" stop-color="#030b14" />
    </linearGradient>

    <linearGradient id="bentoCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a29" />
      <stop offset="100%" stop-color="#030e18" />
    </linearGradient>

    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="amberPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <pattern id="bentoDot" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#15364e" opacity="0.6"/>
    </pattern>

    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="740" rx="16" fill="url(#bentoBg)" stroke="#16394f" stroke-width="2" />
  <rect width="1200" height="740" fill="url(#bentoDot)" />

  <!-- HEADER -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#00F2FE" class="font-mono" font-size="12" font-weight="800" letter-spacing="2">02 // CORE ARCHITECTURAL PILLARS</text>
    <text x="0" y="28" fill="#FFFFFF" class="font-sans" font-size="22" font-weight="900">High-Throughput Enterprise Capabilities Matrix</text>
    <text x="0" y="50" fill="#94A3B8" class="font-sans" font-size="13.5">Mission-critical engineering guarantees powering zero-data-loss telemetry pipelines</text>
  </g>

  <!-- ================= ROW 1: 3 CARDS ================= -->

  <!-- CARD 1: ZERO-ALLOCATION RING BUFFER (X: 50, Y: 110) -->
  <g transform="translate(50, 110)">
    <rect width="350" height="270" rx="12" fill="url(#bentoCard)" stroke="#1e4663" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="4" rx="2" fill="url(#cyanPill)" />
    
    <circle cx="36" cy="38" r="16" fill="#072b3d" stroke="#00F2FE" stroke-width="1.5" />
    <text x="36" y="43" fill="#00F2FE" class="font-mono" font-size="13" font-weight="800" text-anchor="middle">01</text>
    
    <text x="64" y="34" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">Zero-Allocation Buffer</text>
    <text x="64" y="50" fill="#00F2FE" class="font-mono" font-size="10.5" font-weight="700">OFF-HEAP MEMORY ARENA</text>
    
    <text x="20" y="86" fill="#94A3B8" class="font-sans" font-size="12" font-weight="500">
      <tspan x="20" dy="0">Pre-allocated 64MB off-heap ring buffer</tspan>
      <tspan x="20" dy="20">bypassing runtime GC pauses completely.</tspan>
    </text>

    <!-- Key Metrics Box -->
    <g transform="translate(20, 140)">
      <rect width="310" height="105" rx="8" fill="#031320" stroke="#11334b" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Memory Model: Cache-Aligned Ring</text>
      <text x="14" y="44" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Allocation Overhead: 0 Bytes Heap</text>
      <text x="14" y="64" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Throughput: 1,428,500 msg/sec</text>
      <text x="14" y="86" fill="#00F2FE" class="font-mono" font-size="11" font-weight="800">STATUS: ZERO GC PAUSES</text>
    </g>
  </g>

  <!-- CARD 2: WRITE-AHEAD LOG ENGINE (X: 425, Y: 110) -->
  <g transform="translate(425, 110)">
    <rect width="350" height="270" rx="12" fill="url(#bentoCard)" stroke="#1e4663" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="4" rx="2" fill="url(#emeraldPill)" />
    
    <circle cx="36" cy="38" r="16" fill="#062e24" stroke="#10B981" stroke-width="1.5" />
    <text x="36" y="43" fill="#10B981" class="font-mono" font-size="13" font-weight="800" text-anchor="middle">02</text>
    
    <text x="64" y="34" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">Sequential WAL Engine</text>
    <text x="64" y="50" fill="#10B981" class="font-mono" font-size="10.5" font-weight="700">DIRECT I/O APPEND-ONLY</text>
    
    <text x="20" y="86" fill="#94A3B8" class="font-sans" font-size="12" font-weight="500">
      <tspan x="20" dy="0">Direct I/O append-only sequential writes</tspan>
      <tspan x="20" dy="20">bypassing kernel OS page cache stalls.</tspan>
    </text>

    <!-- Key Metrics Box -->
    <g transform="translate(20, 140)">
      <rect width="310" height="105" rx="8" fill="#031812" stroke="#0a392b" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Write Pattern: Strict Append-Only</text>
      <text x="14" y="44" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Amplification: 1.02x Near-Unity</text>
      <text x="14" y="64" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Ordering: Cryptographic Sequence</text>
      <text x="14" y="86" fill="#10B981" class="font-mono" font-size="11" font-weight="800">STATUS: O_DIRECT ACCELERATED</text>
    </g>
  </g>

  <!-- CARD 3: PRIMARY SINK - activity.log (X: 800, Y: 110) -->
  <g transform="translate(800, 110)">
    <rect width="350" height="270" rx="12" fill="url(#bentoCard)" stroke="#10b981" stroke-width="1.8" />
    <rect x="0" y="0" width="350" height="4" rx="2" fill="url(#emeraldPill)" />
    
    <circle cx="36" cy="38" r="16" fill="#05261d" stroke="#10B981" stroke-width="1.5" />
    <text x="36" y="43" fill="#10B981" class="font-mono" font-size="13" font-weight="800" text-anchor="middle">03</text>
    
    <text x="64" y="34" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">Immutable Primary Sink</text>
    <text x="64" y="50" fill="#34D399" class="font-mono" font-size="10.5" font-weight="700">TARGET: activity.log</text>
    
    <text x="20" y="86" fill="#94A3B8" class="font-sans" font-size="12" font-weight="500">
      <tspan x="20" dy="0">Immutable single-source-of-truth sink</tspan>
      <tspan x="20" dy="20">capturing 100% of state transactions.</tspan>
    </text>

    <!-- Key Metrics Box -->
    <g transform="translate(20, 140)">
      <rect width="310" height="105" rx="8" fill="#041a14" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="24" fill="#34D399" class="font-mono" font-size="12" font-weight="800">FILE: ./activity.log</text>
      <text x="14" y="44" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• SLA Durability: 99.999% Guaranteed</text>
      <text x="14" y="64" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Format: ATM-V3 Temporal Stream</text>
      <text x="14" y="86" fill="#10B981" class="font-mono" font-size="11" font-weight="800">STATUS: CONTINUOUS STREAMING</text>
    </g>
  </g>

  <!-- ================= ROW 2: 3 CARDS ================= -->

  <!-- CARD 4: ADAPTIVE MICRO-BATCHING (X: 50, Y: 410) -->
  <g transform="translate(50, 410)">
    <rect width="350" height="270" rx="12" fill="url(#bentoCard)" stroke="#1e4663" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="4" rx="2" fill="url(#amberPill)" />
    
    <circle cx="36" cy="38" r="16" fill="#361f06" stroke="#F59E0B" stroke-width="1.5" />
    <text x="36" y="43" fill="#F59E0B" class="font-mono" font-size="13" font-weight="800" text-anchor="middle">04</text>
    
    <text x="64" y="34" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">Adaptive Micro-Batching</text>
    <text x="64" y="50" fill="#F59E0B" class="font-mono" font-size="10.5" font-weight="700">DYNAMIC WATERMARK ENGINE</text>
    
    <text x="20" y="86" fill="#94A3B8" class="font-sans" font-size="12" font-weight="500">
      <tspan x="20" dy="0">Dynamic watermark flusher adjusting cadence</tspan>
      <tspan x="20" dy="20">between 10ms and 100ms based on load.</tspan>
    </text>

    <!-- Key Metrics Box -->
    <g transform="translate(20, 140)">
      <rect width="310" height="105" rx="8" fill="#1d1303" stroke="#422c06" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Flush Window: 10ms - 100ms Adaptive</text>
      <text x="14" y="44" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Backpressure: Dynamic Watermark</text>
      <text x="14" y="64" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Buffer Saturation: &lt; 15% Normal</text>
      <text x="14" y="86" fill="#F59E0B" class="font-mono" font-size="11" font-weight="800">STATUS: ZERO DROP POLICY</text>
    </g>
  </g>

  <!-- CARD 5: CONSENSUS RECONCILER (X: 425, Y: 410) -->
  <g transform="translate(425, 410)">
    <rect width="350" height="270" rx="12" fill="url(#bentoCard)" stroke="#1e4663" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="4" rx="2" fill="url(#purplePill)" />
    
    <circle cx="36" cy="38" r="16" fill="#240c36" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="36" y="43" fill="#A78BFA" class="font-mono" font-size="13" font-weight="800" text-anchor="middle">05</text>
    
    <text x="64" y="34" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">Consensus Reconciler</text>
    <text x="64" y="50" fill="#A78BFA" class="font-mono" font-size="10.5" font-weight="700">MULTI-RAFT QUORUM BUS</text>
    
    <text x="20" y="86" fill="#94A3B8" class="font-sans" font-size="12" font-weight="500">
      <tspan x="20" dy="0">Multi-Raft quorum consensus engine</tspan>
      <tspan x="20" dy="20">rejecting ghost and duplicate commits.</tspan>
    </text>

    <!-- Key Metrics Box -->
    <g transform="translate(20, 140)">
      <rect width="310" height="105" rx="8" fill="#170724" stroke="#3b1959" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Quorum Strategy: 3-Node Multi-Raft</text>
      <text x="14" y="44" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Duplicate Rejection: 100% Rate</text>
      <text x="14" y="64" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Partition Tolerance: Split-Brain Safe</text>
      <text x="14" y="86" fill="#A78BFA" class="font-mono" font-size="11" font-weight="800">STATUS: QUORUM REACHED</text>
    </g>
  </g>

  <!-- CARD 6: OPENTELEMETRY PARITY (X: 800, Y: 410) -->
  <g transform="translate(800, 410)">
    <rect width="350" height="270" rx="12" fill="url(#bentoCard)" stroke="#1e4663" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="4" rx="2" fill="url(#cyanPill)" />
    
    <circle cx="36" cy="38" r="16" fill="#072b3d" stroke="#38BDF8" stroke-width="1.5" />
    <text x="36" y="43" fill="#38BDF8" class="font-mono" font-size="13" font-weight="800" text-anchor="middle">06</text>
    
    <text x="64" y="34" fill="#FFFFFF" class="font-sans" font-size="16" font-weight="800">OpenTelemetry 3NF</text>
    <text x="64" y="50" fill="#38BDF8" class="font-mono" font-size="10.5" font-weight="700">SEMANTIC SPEC CONVENTION</text>
    
    <text x="20" y="86" fill="#94A3B8" class="font-sans" font-size="12" font-weight="500">
      <tspan x="20" dy="0">Strict OpenTelemetry 3NF schema parity</tspan>
      <tspan x="20" dy="20">with deterministic SHA-256 validation.</tspan>
    </text>

    <!-- Key Metrics Box -->
    <g transform="translate(20, 140)">
      <rect width="310" height="105" rx="8" fill="#031320" stroke="#11334b" stroke-width="1" />
      <text x="14" y="24" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Spec Version: OTel v1.32+ Compatible</text>
      <text x="14" y="44" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Normalization: 3NF Relational Model</text>
      <text x="14" y="64" fill="#E2E8F0" class="font-sans" font-size="11.5" font-weight="700">• Hash Verification: CRC32 / SHA-256</text>
      <text x="14" y="86" fill="#38BDF8" class="font-mono" font-size="11" font-weight="800">STATUS: OTel CERTIFIED</text>
    </g>
  </g>
</svg>
