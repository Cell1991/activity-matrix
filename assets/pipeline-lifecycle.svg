<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020712" />
      <stop offset="100%" stop-color="#030d17" />
    </linearGradient>

    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="stepGradSink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <pattern id="pipeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#143147" opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    @keyframes flowLine {
      to { stroke-dashoffset: -120; }
    }
    @keyframes bounceGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #00F2FE); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 10px #00F2FE); }
    }
    .flow-dash {
      stroke-dasharray: 6 8;
      animation: flowLine 2s linear infinite;
    }
    .pulse-node {
      transform-origin: center;
      animation: bounceGlow 3s ease-in-out infinite;
    }
    .font-c { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-h { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-b { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
  </style>

  <rect width="1200" height="360" rx="16" fill="url(#pipeBg)" stroke="#16394f" stroke-width="2" />
  <rect width="1200" height="360" fill="url(#pipeGrid)" />

  <!-- HEADER -->
  <g transform="translate(45, 30)">
    <text x="0" y="0" fill="#8B5CF6" class="font-c" font-size="11" font-weight="700" letter-spacing="2">04 // INGESTION PIPELINE LIFECYCLE</text>
    <text x="0" y="24" fill="#FFFFFF" class="font-h" font-size="20">End-to-End Atomic Mutation Pipeline</text>
    <text x="0" y="44" fill="#94A3B8" class="font-b" font-size="13">Continuous 5-stage transformation pipeline from distributed telemetry emission to append-only disk commit</text>
  </g>

  <!-- CONNECTING ANIMATED DATA PIPE -->
  <path d="M 145 200 L 1055 200" fill="none" stroke="#16435f" stroke-width="6" />
  <path d="M 145 200 L 1055 200" fill="none" stroke="#00F2FE" stroke-width="2.5" class="flow-dash" />

  <!-- ================= 5 STAGES ================= -->

  <!-- STAGE 01: DISPATCH -->
  <g transform="translate(45, 120)">
    <rect width="200" height="180" rx="10" fill="#051a28" stroke="#174563" stroke-width="1.2" />
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#00F2FE" />
    
    <circle cx="100" cy="40" r="18" fill="#082b3d" stroke="#00F2FE" stroke-width="1.5" />
    <text x="100" y="45" fill="#00F2FE" class="font-c" font-size="12" font-weight="800" text-anchor="middle">01</text>
    
    <text x="100" y="80" fill="#FFFFFF" class="font-h" font-size="15" text-anchor="middle">01. DISPATCH</text>
    <text x="100" y="100" fill="#00F2FE" class="font-c" font-size="10" font-weight="700" text-anchor="middle">gRPC / eBPF PROBE</text>
    
    <text x="100" y="125" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">System state mutation</text>
    <text x="100" y="142" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">asynchronously emitted</text>
    <text x="100" y="159" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">over wire-speed mTLS</text>
  </g>

  <!-- STAGE 02: VALIDATE -->
  <g transform="translate(275, 120)">
    <rect width="200" height="180" rx="10" fill="#051a28" stroke="#174563" stroke-width="1.2" />
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#06B6D4" />
    
    <circle cx="100" cy="40" r="18" fill="#082b3d" stroke="#06B6D4" stroke-width="1.5" />
    <text x="100" y="45" fill="#06B6D4" class="font-c" font-size="12" font-weight="800" text-anchor="middle">02</text>
    
    <text x="100" y="80" fill="#FFFFFF" class="font-h" font-size="15" text-anchor="middle">02. VALIDATE</text>
    <text x="100" y="100" fill="#06B6D4" class="font-c" font-size="10" font-weight="700" text-anchor="middle">SESSION ATTESTATION</text>
    
    <text x="100" y="125" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">Token refresh checked;</text>
    <text x="100" y="142" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">corrupt frames dropped</text>
    <text x="100" y="159" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">at ingress gateway</text>
  </g>

  <!-- STAGE 03: ENQUEUE -->
  <g transform="translate(505, 120)">
    <rect width="200" height="180" rx="10" fill="#051a28" stroke="#174563" stroke-width="1.2" />
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#3B82F6" />
    
    <circle cx="100" cy="40" r="18" fill="#08233d" stroke="#3B82F6" stroke-width="1.5" />
    <text x="100" y="45" fill="#3B82F6" class="font-c" font-size="12" font-weight="800" text-anchor="middle">03</text>
    
    <text x="100" y="80" fill="#FFFFFF" class="font-h" font-size="15" text-anchor="middle">03. ENQUEUE</text>
    <text x="100" y="100" fill="#38BDF8" class="font-c" font-size="10" font-weight="700" text-anchor="middle">RING BUFFER ARENA</text>
    
    <text x="100" y="125" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">Staged in 64MB off-heap</text>
    <text x="100" y="142" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">circular ring buffer;</text>
    <text x="100" y="159" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">zero GC allocation</text>
  </g>

  <!-- STAGE 04: SERIALIZE -->
  <g transform="translate(735, 120)">
    <rect width="200" height="180" rx="10" fill="#051a28" stroke="#174563" stroke-width="1.2" />
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#8B5CF6" />
    
    <circle cx="100" cy="40" r="18" fill="#201138" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="100" y="45" fill="#8B5CF6" class="font-c" font-size="12" font-weight="800" text-anchor="middle">04</text>
    
    <text x="100" y="80" fill="#FFFFFF" class="font-h" font-size="15" text-anchor="middle">04. SERIALIZE</text>
    <text x="100" y="100" fill="#A78BFA" class="font-c" font-size="10" font-weight="700" text-anchor="middle">OTel 3NF NORMALIZER</text>
    
    <text x="100" y="125" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">Formatted into strict</text>
    <text x="100" y="142" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">ATM-V3 temporal string</text>
    <text x="100" y="159" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">with payload hash</text>
  </g>

  <!-- STAGE 05: PERSIST (activity.log) -->
  <g transform="translate(965, 120)" class="pulse-node">
    <rect width="190" height="180" rx="10" fill="#042018" stroke="#10b981" stroke-width="1.8" />
    <rect x="0" y="0" width="190" height="4" rx="2" fill="url(#stepGradSink)" />
    
    <circle cx="95" cy="40" r="18" fill="#063327" stroke="#10B981" stroke-width="1.5" />
    <text x="95" y="45" fill="#10B981" class="font-c" font-size="12" font-weight="800" text-anchor="middle">05</text>
    
    <text x="95" y="80" fill="#FFFFFF" class="font-h" font-size="15" text-anchor="middle">05. PERSIST</text>
    <text x="95" y="100" fill="#34D399" class="font-c" font-size="10" font-weight="700" text-anchor="middle">DIRECT I/O FLUSH</text>
    
    <text x="95" y="125" fill="#6EE7B7" class="font-c" font-size="11" font-weight="800" text-anchor="middle">activity.log</text>
    <text x="95" y="142" fill="#94A3B8" class="font-b" font-size="11" text-anchor="middle">Atomic append flush;</text>
    <text x="95" y="159" fill="#10B981" class="font-b" font-size="10" text-anchor="middle">99.999% durability SLA</text>
  </g>
</svg>
